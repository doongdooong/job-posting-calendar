'*{box-sizing:border-box;}',

/* topbar */
'.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 14px 0;}',

'.topbar-actions{position:relative;display:flex;align-items:center;gap:8px;flex:none;}',
'.icon-btn{display:flex;align-items:center;gap:5px;background:var(--surface-alt);border:1px solid var(--border);border-radius:999px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink-soft);transition:background .15s,color .15s,border-color .15s;}',

'.popover{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow);padding:10px;min-width:212px;z-index:40;}',
'.popover-title{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;padding:2px 6px 8px;font-weight:600;}',

'.swatch{width:10px;height:10px;border-radius:3px;flex:none;}',

'.sort-chip.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600;}',
'.sort-badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:999px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;flex:none;}',

'.month-nav{display:flex;align-items:center;gap:4px;padding:2px 0 10px;}',
'.nav-btn{width:32px;height:32px;border-radius:999px;border:1px solid var(--border);background:var(--surface-alt);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}',
'.nav-btn:hover{background:var(--accent-soft);border-color:var(--accent);}',
'.nav-btn svg{width:16px;height:16px;}',
'.month-title-wrap{flex:1;text-align:center;min-width:0;padding:0 6px;}',
'#monthTitle{display:block;font-size:19px;font-weight:700;letter-spacing:-0.01em;}',
'#summaryLine{display:block;font-size:11.5px;color:var(--ink-faint);margin-top:2px;}',
'.today-btn{border:1px solid var(--border);background:var(--surface-alt);border-radius:999px;padding:0 13px;height:32px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);flex:none;}',
'.today-btn:hover{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent);}',

/* view toggle (list / calendar) */
'.view-toggle{display:flex;align-items:center;background:var(--surface-alt);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;flex:none;}',
'.view-btn{width:30px;height:30px;border:none;background:transparent;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-faint);}',
'.view-btn svg{width:16px;height:16px;}',
'.view-btn.active{background:var(--surface);color:var(--accent-ink);box-shadow:0 1px 2px rgba(27,32,48,0.14);}',
'.view-btn:hover:not(.active){color:var(--ink-soft);}',

/* list view */
'.list-header{display:flex;align-items:baseline;justify-content:space-between;padding:14px 6px 8px;}',
'.list-header .list-title{font-size:16px;font-weight:700;letter-spacing:-0.01em;}',
'.list-header .list-summary{font-size:11.5px;color:var(--ink-faint);}',
'.list-section-label{font-size:11px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;padding:16px 6px 6px;}',
'.list-row{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--border);background:var(--surface);cursor:pointer;}',
'.list-row:hover{background:var(--surface-alt);}',
'.list-row.applied .row-company{text-decoration:line-through;text-decoration-color:var(--ink-faint);}',
'.list-row.applied{opacity:.66;}',
'.row-main{flex:1;min-width:0;}',
'.row-title-line{display:flex;align-items:center;gap:7px;}',
'.row-company{font-size:14.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}',
/* Same fill colors as the calendar bars (--pri-*-bg), not the darker "-ink" text
   colors — a thin matching-hue ring keeps the pale fill visible against white. */
'.pri-dot{width:0.72em;height:0.72em;border-radius:50%;flex:none;background:var(--pri-none-bg);border:1.5px solid var(--pri-none-ink);}',
'.pri-dot.pri-high{background:var(--pri-high-bg);border-color:var(--pri-high-ink);}',
'.pri-dot.pri-medium{background:var(--pri-med-bg);border-color:var(--pri-med-ink);}',
'.pri-dot.pri-low{background:var(--pri-low-bg);border-color:var(--pri-low-ink);}',
'.row-sub-line{font-size:12px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}',
'.row-date-line{font-size:11.5px;color:var(--ink-faint);margin-top:3px;}',
'.switch.sm{width:38px;height:22px;flex:none;}',
'.switch.sm .knob{width:18px;height:18px;top:2px;left:2px;}',
'.switch.sm.on .knob{transform:translateX(16px);}',
'.list-empty{text-align:center;color:var(--ink-faint);font-size:12.5px;padding:40px 10px;}',

/* calendar */
'main{flex:1;padding:0 8px 96px;max-width:1080px;margin:0 auto;width:100%;}',
'.weekday-row{display:grid;grid-template-columns:repeat(7,1fr);padding:10px 4px 4px;}',
'.weekday-row span{text-align:center;font-size:11px;font-weight:600;color:var(--ink-faint);letter-spacing:.04em;}',
'.weekday-row span:first-child{color:var(--danger);}',
'.weekday-row span:last-child{color:var(--accent);}',
'.weeks{border-top:1px solid var(--border);border-left:1px solid var(--border);}',
/* Every week row is a FIXED height regardless of how many postings fall in it — a
   busy week shows an overflow chip instead of growing taller, so the grid stays
   visually stable as you page through months. Keep in sync with CAL_* JS constants. */
'.week-row{position:relative;display:grid;grid-template-columns:repeat(7,1fr);height:89px;}',
'.day-cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:3px 2px 0;min-width:0;background:var(--surface);}',
'.day-cell.out{background:var(--surface-alt);}',
'.day-num-row{display:flex;justify-content:flex-start;padding:0 1px 2px;}',
'.day-num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;font-weight:500;color:var(--ink-soft);width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:999px;}',
'.day-cell.out .day-num{color:var(--ink-faint);}',
'.day-cell.sunday .day-num{color:var(--danger);}',
'.day-cell.saturday .day-num{color:var(--accent);}',
'.day-num.is-today{background:var(--accent);color:#fff;font-weight:700;}',
/* events-overlay sits ON TOP of the day cells as its own 7-col grid, so a multi-day
   posting renders as ONE spanning grid item (a genuinely continuous bar) instead of
   per-day pieces stitched together at cell borders. */
'.events-overlay{position:absolute;left:0;right:0;top:20px;bottom:0;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:16px;row-gap:1px;pointer-events:none;}',
'.bar{height:16px;line-height:16px;font-size:10.5px;font-weight:500;padding:0 4px;margin:0 1px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;background:var(--pri-none-bg);color:var(--pri-none-ink);border-radius:0;pointer-events:auto;}',
'.bar.round-l{border-top-left-radius:4px;border-bottom-left-radius:4px;}',
'.bar.round-r{border-top-right-radius:4px;border-bottom-right-radius:4px;}',
'.bar:hover{filter:brightness(0.96);}',
'.bar.pri-high{background:var(--pri-high-bg);color:var(--pri-high-ink);}',
'.bar.pri-medium{background:var(--pri-med-bg);color:var(--pri-med-ink);}',
'.bar.pri-low{background:var(--pri-low-bg);color:var(--pri-low-ink);}',
'.bar.status-applied{filter:saturate(0.5) brightness(1.03);}',
':root[data-theme="dark"] .bar.status-applied,@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bar.status-applied{filter:saturate(0.6) brightness(0.92);}}',
'.more-chip{height:16px;line-height:16px;font-size:9.5px;font-weight:600;color:var(--ink-faint);background:transparent;border:none;text-align:left;padding:0 4px;margin:0 1px;cursor:pointer;border-radius:4px;pointer-events:auto;}',
'.more-chip:hover{background:var(--surface-alt);color:var(--accent-ink);}',

/* undated section */
'.undated{margin-top:18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:6px 4px;}',
'.undated summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-soft);}',
'.undated summary::-webkit-details-marker{display:none;}',
'.undated summary svg{width:14px;height:14px;transition:transform .15s;color:var(--ink-faint);}',
'.undated[open] summary svg{transform:rotate(90deg);}',
'.undated-list{display:flex;flex-wrap:wrap;gap:7px;padding:2px 12px 12px;}',
'.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:500;cursor:pointer;background:var(--pri-none-bg);color:var(--pri-none-ink);border:none;}',
'.chip.pri-high{background:var(--pri-high-bg);color:var(--pri-high-ink);}',
'.chip.pri-medium{background:var(--pri-med-bg);color:var(--pri-med-ink);}',
'.chip.pri-low{background:var(--pri-low-bg);color:var(--pri-low-ink);}',
'.chip.status-applied{filter:saturate(0.55) brightness(1.03);}',

/* empty state */
'.empty-hint{text-align:center;color:var(--ink-faint);font-size:12.5px;padding:26px 10px 6px;}',

/* fab */
'.fab{position:fixed;right:20px;bottom:24px;width:56px;height:56px;border-radius:999px;background:var(--accent);color:#fff;border:none;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:30;}',
'.fab svg{width:24px;height:24px;}',
'.fab:hover{filter:brightness(1.08);}',
'.fab:active{transform:scale(0.96);}',

/* modal */
'.overlay{position:fixed;inset:0;background:rgba(15,18,26,0.44);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0;}',
'@media(min-width:640px){.overlay{align-items:center;padding:20px;}}',
'.modal{background:var(--surface);width:100%;max-width:460px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;box-shadow:var(--shadow);animation:slideUp .18s ease;}',
'@media(min-width:640px){.modal{border-radius:var(--radius-lg);}}',
'@keyframes slideUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}',
'.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px;position:sticky;top:0;background:var(--surface);}',
'.modal-head h2{font-size:16px;font-weight:700;margin:0;}',
'.modal-close{width:30px;height:30px;border-radius:999px;border:none;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);}',
'.modal-close:hover{background:var(--accent-soft);color:var(--accent-ink);}',
'.modal-body{padding:14px 18px 20px;}',

/* form */
'.field{margin-bottom:15px;min-width:0;}',
'.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}',
'.field label .req{color:var(--danger);margin-left:2px;}',
/* font-size must be >=16px on iOS Safari — anything smaller makes it auto-zoom the
   page on focus. Kept at exactly 16px (not larger) to avoid oversized-looking fields. */
'.field input[type=text],.field input[type=url],.field input[type=date],.field input[type=time],.field select,.field textarea{width:100%;min-width:0;box-sizing:border-box;border:1px solid var(--border);background:var(--surface-alt);border-radius:var(--radius-sm);padding:10px 11px;font-size:16px;color:var(--ink);font-family:inherit;}',
'.field textarea{resize:vertical;min-height:64px;line-height:1.4;}',
'.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;background:var(--surface);}',
/* Date + time fields are stacked full-width (not side-by-side) — a native date/time
   input's minimum rendering width on iOS Safari can exceed a half-width column and
   visually overlap its neighbor. A leading calendar/clock icon marks what each field
   is for, since an empty native date/time input shows no icon of its own on iOS. */
'.input-icon-wrap{position:relative;flex:none;}',
'.input-icon-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-faint);pointer-events:none;}',
'.field input.icon-input{padding-left:32px;padding-right:8px;font-family:"IBM Plex Mono",ui-monospace,monospace;}',
/* Sized to hold a date ("0000.00.00.") or time ("00:00") value and nothing more — a
   narrow, content-sized field (rather than width:100%) is what actually keeps the two
   from overlapping on iOS Safari, regardless of container width. Fixed px, not ch: the
   native picker renders its own value text (e.g. Korean "오후 10:13" for time) which
   ignores our font-family/font-size, so ch against our CSS font under-measured it. */
'.dt-row{display:flex;align-items:center;gap:10px;row-gap:8px;flex-wrap:wrap;}', // graceful 2nd line on very narrow screens, single line otherwise
'.dt-row .dt-date input{width:172px;}',
'.dt-row .dt-time input{width:136px;}',
'.hint{font-size:11.5px;color:var(--ink-faint);margin-top:5px;}',
'.pill-select{display:flex;gap:7px;flex-wrap:wrap;}',
'.pill-opt{border:1.5px solid var(--border);background:var(--surface-alt);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;color:var(--ink-soft);font-weight:500;}',
'.pill-opt.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600;}',
'.pill-opt.pri-high.selected{border-color:var(--pri-high-ink);background:var(--pri-high-bg);color:var(--pri-high-ink);}',
'.pill-opt.pri-medium.selected{border-color:var(--pri-med-ink);background:var(--pri-med-bg);color:var(--pri-med-ink);}',
'.pill-opt.pri-low.selected{border-color:var(--pri-low-ink);background:var(--pri-low-bg);color:var(--pri-low-ink);}',
'.form-actions{display:flex;gap:9px;margin-top:20px;}',
'.btn{flex:1;border:none;border-radius:var(--radius-sm);padding:12px;font-size:14.5px;font-weight:600;cursor:pointer;}',
'.btn-primary{background:var(--accent);color:#fff;}',
'.btn-primary:hover{filter:brightness(1.07);}',
'.btn-ghost{background:var(--surface-alt);color:var(--ink-soft);border:1px solid var(--border);}',

/* ============ date helpers ============ */
var WD_KR = ['일','월','화','수','목','금','토'];
function pad2(n){ return n<10 ? '0'+n : ''+n; }
function ymd(y,m,d){ return y+'-'+pad2(m)+'-'+pad2(d); }
function parseYMD(s){
  if(!s) return null;
  var parts = s.split('-');
  if(parts.length!==3) return null;
  var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
  if(isNaN(d.getTime())) return null;
  return d;
}
function dateToStr(d){ return ymd(d.getFullYear(), d.getMonth()+1, d.getDate()); }
function sameDate(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function addDays(d,n){ var r=new Date(d); r.setDate(r.getDate()+n); return r; }
function dayDiff(a,b){ return Math.round((b-a)/86400000); }
function fmtMonthTitle(y,m){ return y+'년 '+m+'월'; }
function fmtDateKR(d){ return (d.getMonth()+1)+'월 '+d.getDate()+'일('+WD_KR[d.getDay()]+')'; }
function fmtDateFull(dStr, tStr){
  var d = parseYMD(dStr);
  if(!d) return '';
  var s = d.getFullYear()+'년 '+fmtDateKR(d);
  if(tStr){ s += ' ' + tStr; }
  return s;
}
function todayStr(){ return dateToStr(new Date()); }

var LS_PREF_KEY = 'jobcal_prefs_v1';
var ICON_CALENDAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';

/* ============ state ============ */
var state = (window.__APP_STATE__ && window.__APP_STATE__.postings) ? window.__APP_STATE__ : { postings: [] };
var caps = null; // artifact capability namespace
var canWrite = true;
var view = { year: (new Date()).getFullYear(), month: (new Date()).getMonth()+1 }; // 1-12
var filter = { applying: true, applied: true };
var viewMode = 'calendar'; // 'calendar' | 'list'
var sortOrder = []; // list view only: ordered subset of ['priority','deadline'] — click order = sort precedence
var saving = false;

function loadPrefs(){
  try{
    var raw = localStorage.getItem(LS_PREF_KEY);
    if(raw){
      var p = JSON.parse(raw);
      if(p.filter) filter = p.filter;
      if(p.view) view = p.view;
      if(p.viewMode==='calendar' || p.viewMode==='list') viewMode = p.viewMode;
      if(Array.isArray(p.sortOrder)) sortOrder = p.sortOrder.filter(function(k){ return k==='priority' || k==='deadline'; });
    }
  }catch(e){}
}
function savePrefs(){
  try{ localStorage.setItem(LS_PREF_KEY, JSON.stringify({filter:filter, view:view, viewMode:viewMode, sortOrder:sortOrder})); }catch(e){}
}

/* ============ build full document (for publish) ============ */
function buildFullHTML(newState){
  var json = JSON.stringify(newState).replace(/</g, '\\u003c');
  var stateScript = '<script>window.__APP_STATE__ = ' + json + ';<' + '/script>';
  return '<!doctype html>\n<html lang="ko">\n<head>\n' + FIXED_HEAD + '\n</head>\n<body>\n<div id="app"></div>\n' +
    stateScript + '\n' + APP_SCRIPT_OUTER_HTML + '\n</body>\n</html>';
}

/* ============ persistence ============ */
function uid(){ return 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

async function persist(newState){
  state = newState;
  if(caps){
    saving = true; renderChrome();
    try{
      try{ sessionStorage.setItem('jobcal_view_stash', JSON.stringify(view)); }catch(e){}
      await caps.publish(buildFullHTML(state));
      // success: view will reload automatically
    }catch(err){
      saving = false;
      handlePublishError(err);
      render();
    }
  } else {
    try{ localStorage.setItem(LS_FALLBACK_KEY, JSON.stringify(state)); }catch(e){}
    render();
  }
}

function handlePublishError(err){
  var code = err && err.code;
  if(code === 'conflict'){
    // reload incoming; nothing to do
    return;
  }
  if(code === 'not_writer' || code === 'not_granted' || code === 'consent_required'){
    canWrite = false;
    showToast('이 보기는 읽기 전용입니다.');
    return;
  }
  showToast('저장하지 못했어요. 다시 시도해주세요.');
}

/* ============ toast ============ */
function showToast(msg){
  var host = document.getElementById('toastHost');
  if(!host) return;
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  host.appendChild(t);
  requestAnimationFrame(function(){ t.classList.add('show'); });
  setTimeout(function(){
    t.classList.remove('show');
    setTimeout(function(){ t.remove(); }, 220);
  }, 2200);
}

/* ============ data helpers ============ */
function resolveRange(p){
  var s = p.startDate ? parseYMD(p.startDate) : null;
  var e = p.deadlineDate ? parseYMD(p.deadlineDate) : null;
  if(s && e){
    if(e < s){ var tmp=s; s=e; e=tmp; }
    return { start: s, end: e };
  }
  if(!s && e) return { start: e, end: e };
  if(s && !e) return { start: s, end: s };
  return null;
}
function isVisible(p){
  return !!filter[p.status];
}
function priorityClass(p){
  return p.priority ? ('pri-' + p.priority) : '';
}

/* ============ month matrix ============ */
function buildMonthMatrix(year, month){ // month 1-12
  var first = new Date(year, month-1, 1);
  var startOffset = first.getDay();
  var gridStart = addDays(first, -startOffset);
  var weeks = [];
  for(var w=0; w<6; w++){
    var week = [];
    for(var d=0; d<7; d++){
      var date = addDays(gridStart, w*7+d);
      week.push({ date: date, inMonth: date.getMonth()===(month-1) });
    }
    weeks.push(week);
  }
  return weeks;
}

/* ============ week layout (lane assignment) ============ */
var MAX_LANES = 3; // + 1 reserved overflow slot below, kept in fixed .week-row height
function computeWeekLayout(weekDates, postings){
  var weekStart = weekDates[0], weekEnd = weekDates[6];
  var segments = [];
  postings.forEach(function(p){
    var r = resolveRange(p);
    if(!r) return;
    if(r.end < weekStart || r.start > weekEnd) return;
    var segStart = r.start < weekStart ? weekStart : r.start;
    var segEnd = r.end > weekEnd ? weekEnd : r.end;
    var colStart = dayDiff(weekStart, segStart);
    var colEnd = dayDiff(weekStart, segEnd);
    segments.push({
      posting: p, colStart: colStart, colEnd: colEnd,
      isTrueStart: sameDate(segStart, r.start),
      isTrueEnd: sameDate(segEnd, r.end)
    });
  });
  segments.sort(function(a,b){
    if(a.colStart !== b.colStart) return a.colStart - b.colStart;
    return (b.colEnd-b.colStart) - (a.colEnd-a.colStart);
  });
  var laneEnds = [];
  segments.forEach(function(seg){
    var lane = -1;
    for(var i=0;i<laneEnds.length;i++){ if(laneEnds[i] < seg.colStart){ lane=i; break; } }
    if(lane===-1){ lane = laneEnds.length; laneEnds.push(seg.colEnd); }
    else { laneEnds[lane] = seg.colEnd; }
    seg.lane = lane;
  });
  var visibleSegments = [];
  var overflowByDay = [[],[],[],[],[],[],[]];
  segments.forEach(function(seg){
    if(seg.lane < MAX_LANES){
      visibleSegments.push(seg);
    } else {
      for(var c=seg.colStart; c<=seg.colEnd; c++){ overflowByDay[c].push(seg.posting); }
    }
  });
  var laneCountUsed = Math.min(MAX_LANES, laneEnds.length);
  return { segments: visibleSegments, overflowByDay: overflowByDay, laneCountUsed: laneCountUsed };
}

/* ============ escaping ============ */
function esc(s){
  if(s===null || s===undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ============ render: chrome (topbar) ============ */
function computeCounts(){
  var total=0, applying=0, applied=0;
  state.postings.forEach(function(p){ total++; if(p.status==='applied') applied++; else applying++; });
  return {total:total, applying:applying, applied:applied};
}

function renderChrome(){
  var mt = document.getElementById('monthTitle');
  var sl = document.getElementById('summaryLine');
  if(mt) mt.textContent = fmtMonthTitle(view.year, view.month) + (saving ? ' · 저장 중…' : '');
  if(sl){
    var c = computeCounts();
    sl.textContent = '총 ' + c.total + '건 · 지원중 ' + c.applying + ' · 지원완료 ' + c.applied;
  }
}

/* ============ render: calendar ============ */
function renderCalendar(){
  var weeks = buildMonthMatrix(view.year, view.month);
  var visiblePostings = state.postings.filter(isVisible);
  var todayS = todayStr();

  var html = '';
  weeks.forEach(function(week){
    var weekDates = week.map(function(w){ return w.date; });
    var layout = computeWeekLayout(weekDates, visiblePostings);

    html += '<div class="week-row">';
    for(var c=0;c<7;c++){
      var info = week[c];
      var d = info.date;
      var dStr = dateToStr(d);
      var isToday = dStr === todayS;
      var classes = ['day-cell'];
      if(!info.inMonth) classes.push('out');
      if(c===0) classes.push('sunday');
      if(c===6) classes.push('saturday');
      html += '<div class="'+classes.join(' ')+'">';
      html += '<div class="day-num-row"><span class="day-num'+(isToday?' is-today':'')+'">'+d.getDate()+'</span></div>';
      html += '</div>';
    }
    // events overlay: one grid item per SEGMENT (spans multiple day-columns as a single
    // continuous bar) rather than one item per day, so multi-day postings render unbroken.
    // Row height is fixed (see .week-row), so overflow beyond MAX_LANES always lands in
    // the reserved slot at grid-row MAX_LANES+1 instead of growing the cell.
    html += '<div class="events-overlay">';
    layout.segments.forEach(function(seg){
      var p = seg.posting;
      var barClasses = ['bar'];
      if(p.priority) barClasses.push('pri-'+p.priority);
      if(seg.isTrueStart) barClasses.push('round-l');
      if(seg.isTrueEnd) barClasses.push('round-r');
      if(p.status==='applied') barClasses.push('status-applied');
      var label = (p.status==='applied' ? '✓ ' : '') + esc(p.company);
      var gridStyle = 'grid-column:'+(seg.colStart+1)+' / '+(seg.colEnd+2)+';grid-row:'+(seg.lane+1);
      html += '<div class="'+barClasses.join(' ')+'" style="'+gridStyle+'" data-id="'+esc(p.id)+'" data-open-detail="1">'+label+'</div>';
    });
    for(var c2=0;c2<7;c2++){
      if(layout.overflowByDay[c2].length){
        var dStr2 = dateToStr(week[c2].date);
        html += '<button class="more-chip" style="grid-column:'+(c2+1)+';grid-row:'+(MAX_LANES+1)+'" data-more-date="'+dStr2+'">+'+layout.overflowByDay[c2].length+'건</button>';
      }
    }
    html += '</div>';
    html += '</div>';
  });

  document.getElementById('weeksHost').innerHTML = html;

  // undated section
  var undated = state.postings.filter(isVisible).filter(function(p){ return !resolveRange(p); });
  var undatedHost = document.getElementById('undatedHost');
  if(undated.length){
    var items = undated.map(function(p){
      var cls = ['chip'];
      if(p.priority) cls.push('pri-'+p.priority);
      if(p.status==='applied') cls.push('status-applied');
      var mark = p.status==='applied' ? '✓ ' : '';
      return '<button class="'+cls.join(' ')+'" data-id="'+esc(p.id)+'" data-open-detail="1">'+mark+esc(p.company)+'</button>';
    }).join('');
    undatedHost.innerHTML =
      '<details class="undated" open>'+
        '<summary><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>날짜 미정 ('+undated.length+')</summary>'+
        '<div class="undated-list">'+items+'</div>'+
      '</details>';
    undatedHost.style.display = '';
  } else {
    undatedHost.innerHTML = '';
    undatedHost.style.display = 'none';
  }

  var emptyHost = document.getElementById('emptyHint');
  if(state.postings.length===0){
    emptyHost.innerHTML = '오른쪽 아래 + 버튼을 눌러 첫 채용공고를 추가해보세요.';
    emptyHost.style.display = '';
  } else if(visiblePostings.length===0 && undated.length===0){
    emptyHost.innerHTML = '표시할 공고가 없어요. 목록 보기의 정렬 버튼에서 필터를 확인해보세요.';
    emptyHost.style.display = '';
  } else {
    emptyHost.style.display = 'none';
  }
}

/* ============ render: list ============ */
function listSortKey(p){
  if(p.deadlineDate) return p.deadlineDate + ' ' + (p.deadlineTime || '00:00');
  if(p.startDate) return p.startDate + ' 00:00';
  return null;
}
var PRIORITY_RANK = { high: 3, medium: 2, low: 1 };
function priorityRank(p){ return PRIORITY_RANK[p.priority] || 0; }
function compareByCriterion(criterion){
  if(criterion === 'priority'){
    return function(a,b){ return priorityRank(b) - priorityRank(a); }; // high -> low
  }
  if(criterion === 'deadline'){
    return function(a,b){
      var ka = listSortKey(a), kb = listSortKey(b);
      return ka < kb ? -1 : ka > kb ? 1 : 0; // soonest first
    };
  }
  return function(){ return 0; };
}
/* sortOrder is the CLICK ORDER of chosen criteria: the first one picked is the primary
   (outer) sort key, the second is the tie-breaker (inner) key — e.g. picking priority
   then deadline groups by priority first, and sorts by deadline within each group. */
function buildListComparator(order){
  var criteria = order.length ? order : ['deadline']; // unchanged default when nothing chosen
  var comparators = criteria.map(compareByCriterion);
  return function(a,b){
    for(var i=0;i<comparators.length;i++){
      var r = comparators[i](a,b);
      if(r!==0) return r;
    }
    return 0;
  };
}
function formatRowDate(p){
  if(p.startDate && p.deadlineDate){
    return fmtDateKR(parseYMD(p.startDate)) + (p.startTime ? ' ' + p.startTime : '') +
      ' ~ ' + fmtDateKR(parseYMD(p.deadlineDate)) + (p.deadlineTime ? ' ' + p.deadlineTime : '');
  }
  if(p.deadlineDate){
    return '마감 · ' + fmtDateKR(parseYMD(p.deadlineDate)) + (p.deadlineTime ? ' ' + p.deadlineTime : '');
  }
  if(p.startDate){
    return '시작 · ' + fmtDateKR(parseYMD(p.startDate)) + (p.startTime ? ' ' + p.startTime : '');
  }
  return '날짜 미정';
}
function renderListRow(p){
  var isApplied = p.status === 'applied';
  var subParts = [];
  if(p.role) subParts.push(esc(p.role));
  if(p.category) subParts.push(esc(CATEGORY_LABELS[p.category] || p.category));
  var subLine = subParts.length ? '<div class="row-sub-line">'+subParts.join(' · ')+'</div>' : '';
  var priDot = p.priority ? '<span class="pri-dot pri-'+p.priority+'"></span>' : '';
  return (
    '<div class="list-row'+(isApplied?' applied':'')+'">'+
      '<button type="button" class="switch sm'+(isApplied?' on':'')+'" data-list-toggle="'+esc(p.id)+'" role="switch" aria-checked="'+isApplied+'" aria-label="지원 상태 토글"><span class="knob"></span></button>'+
      '<div class="row-main" data-open-detail="1" data-id="'+esc(p.id)+'">'+
        '<div class="row-title-line"><span class="row-company">'+esc(p.company)+'</span>'+priDot+'</div>'+
        subLine+
        '<div class="row-date-line">'+formatRowDate(p)+'</div>'+
      '</div>'+
    '</div>'
  );
}
function renderList(){
  var visible = state.postings.filter(isVisible);
  var dated = visible.filter(function(p){ return listSortKey(p)!==null; });
  var undated = visible.filter(function(p){ return listSortKey(p)===null; });
  dated.sort(buildListComparator(sortOrder));
  var html = dated.map(renderListRow).join('');
  if(undated.length){
    html += '<div class="list-section-label">날짜 미정</div>' + undated.map(renderListRow).join('');
  }
  document.getElementById('listHost').innerHTML = html;

  var ls = document.getElementById('listSummary');
  if(ls){
    var c = computeCounts();
    ls.textContent = '총 ' + c.total + '건 · 지원중 ' + c.applying + ' · 지원완료 ' + c.applied;
  }

  var emptyHost = document.getElementById('listEmptyHint');
  if(state.postings.length===0){
    emptyHost.textContent = '오른쪽 아래 + 버튼을 눌러 첫 채용공고를 추가해보세요.';
    emptyHost.style.display = '';
  } else if(visible.length===0){
    emptyHost.textContent = '표시할 공고가 없어요. 목록 보기의 정렬 버튼에서 필터를 확인해보세요.';
    emptyHost.style.display = '';
  } else {
    emptyHost.style.display = 'none';
  }
}

/* ============ view mode (calendar / list) ============ */
function updateViewModeUI(){
  var isList = viewMode === 'list';
  var mainCal = document.getElementById('mainCalendar');
  var mainList = document.getElementById('mainList');
  var monthNav = document.getElementById('monthNavRow');
  if(mainCal) mainCal.hidden = isList;
  if(mainList) mainList.hidden = !isList;
  if(monthNav) monthNav.style.display = isList ? 'none' : '';
  document.querySelectorAll('.view-btn').forEach(function(b){
    var active = b.getAttribute('data-view') === viewMode;
    b.classList.toggle('active', active);
    b.setAttribute('aria-pressed', active ? 'true' : 'false');
  });
  // list view's "정렬" control (sort + status filter combined) is the only place
  // to change the filter — calendar view just reflects whatever it's set to.
  var sortBtn = document.getElementById('sortBtn');
  if(sortBtn) sortBtn.hidden = !isList;
  if(sortBtn){
    sortBtn.classList.toggle('active', sortOrder.length>0 || !(filter.applying && filter.applied));
  }
  renderSortPanelState();
}
function renderSortPanelState(){
  document.querySelectorAll('.sort-chip').forEach(function(chip){
    var key = chip.getAttribute('data-sort-key');
    var idx = sortOrder.indexOf(key);
    chip.classList.toggle('active', idx>-1);
    var badge = chip.querySelector('.sort-badge');
    if(badge){
      if(idx>-1){ badge.hidden = false; badge.textContent = String(idx+1); }
      else { badge.hidden = true; }
    }
  });
}

/* ============ full render ============ */
function render(){
  updateViewModeUI();
  renderChrome();
  if(viewMode === 'list'){
    renderList();
  } else {
    renderCalendar();
  }
}

/* ============ modal system ============ */
function closeModal(){
  var ov = document.querySelector('.overlay');
  if(ov) ov.remove();
}
function openModal(innerHTML, opts){
  closeModal();
  var ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = innerHTML;
  ov.addEventListener('mousedown', function(e){ if(e.target===ov) closeModal(); });
  document.body.appendChild(ov);
  if(opts && opts.onMount) opts.onMount(ov);
  return ov;
}

/* ============ add/edit form ============ */
function openFormModal(existing){
  var isEdit = !!existing;
  var p = existing || { id:null, company:'', role:'', category:'', startDate:'', startTime:'', deadlineDate:'', deadlineTime:'', link:'', priority:'', status:'applying', memo:'' };

  var categoryOpts = ['<option value=""'+(p.category?'':' selected')+'>선택 안 함</option>'];
  Object.keys(CATEGORY_LABELS).forEach(function(k){
    categoryOpts.push('<option value="'+k+'"'+(p.category===k?' selected':'')+'>'+CATEGORY_LABELS[k]+'</option>');
  });

  var priorityOpts = ['none','high','medium','low'].map(function(k){
    var label = k==='none' ? '선택 안 함' : PRIORITY_LABELS[k];
    var sel = (p.priority||'none')===k;
    var cls = 'pill-opt' + (k!=='none' ? ' pri-'+k : '') + (sel?' selected':'');
    return '<button type="button" class="'+cls+'" data-priority-opt="'+(k==='none'?'':k)+'">'+label+'</button>';
  }).join('');

  var html =
  '<div class="modal" role="dialog" aria-modal="true">'+
    '<div class="modal-head"><h2>'+(isEdit?'공고 수정':'채용공고 추가')+'</h2>'+
      '<button class="modal-close" data-close aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'+
    '</div>'+
    '<div class="modal-body">'+
      '<form id="postingForm">'+
        '<div class="field"><label>회사명<span class="req">*</span></label>'+
          '<input type="text" id="f_company" value="'+esc(p.company)+'" placeholder="예: LG전자" autocomplete="off">'+
        '</div>'+
        '<div class="error-msg" id="companyError">회사명을 입력해주세요.</div>'+
        '<div class="field"><label>직무</label>'+
          '<input type="text" id="f_role" value="'+esc(p.role)+'" placeholder="예: HR / 인사기획">'+
        '</div>'+
        '<div class="field"><label>분류</label>'+
          '<select id="f_category">'+categoryOpts.join('')+'</select>'+
        '</div>'+
        '<div class="field"><label>시작</label><div class="dt-row">'+
          '<div class="input-icon-wrap dt-date">'+ICON_CALENDAR+'<input type="date" id="f_start" class="icon-input" value="'+esc(p.startDate)+'"></div>'+
          '<div class="input-icon-wrap dt-time">'+ICON_CLOCK+'<input type="time" id="f_startTime" class="icon-input" value="'+esc(p.startTime)+'"></div>'+
        '</div></div>'+
        '<div class="field"><label>마감</label><div class="dt-row">'+
          '<div class="input-icon-wrap dt-date">'+ICON_CALENDAR+'<input type="date" id="f_deadline" class="icon-input" value="'+esc(p.deadlineDate)+'"></div>'+
          '<div class="input-icon-wrap dt-time">'+ICON_CLOCK+'<input type="time" id="f_time" class="icon-input" value="'+esc(p.deadlineTime)+'"></div>'+
        '</div></div>'+
        '<div class="hint" style="margin-top:-9px;margin-bottom:15px;">날짜를 입력한 경우에만 시간이 사용돼요.</div>'+
        '<div class="field"><label>공고 링크</label>'+
          '<input type="url" id="f_link" value="'+esc(p.link)+'" placeholder="https://...">'+
        '</div>'+
        '<div class="field"><label>우선순위</label><div class="pill-select" id="f_priority_group">'+priorityOpts+'</div></div>'+
        '<div class="field"><label>메모</label>'+
          '<textarea id="f_memo" rows="3" placeholder="예: 근무지, 특이사항 등">'+esc(p.memo)+'</textarea>'+
        '</div>'+
        '<div class="form-actions">'+
          '<button type="button" class="btn btn-ghost" data-close>취소</button>'+
          '<button type="submit" class="btn btn-primary">'+(isEdit?'저장':'추가')+'</button>'+
        '</div>'+
      '</form>'+
    '</div>'+
  '</div>';

  openModal(html, { onMount: function(ov){
    var selectedPriority = p.priority || '';
    ov.querySelectorAll('[data-priority-opt]').forEach(function(btn){
      btn.addEventListener('click', function(){
        selectedPriority = btn.getAttribute('data-priority-opt');
        ov.querySelectorAll('[data-priority-opt]').forEach(function(b){ b.classList.remove('selected'); });
        btn.classList.add('selected');
      });
    });
    ov.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click', closeModal); });
    ov.querySelector('#postingForm').addEventListener('submit', function(e){
      e.preventDefault();
      var company = ov.querySelector('#f_company').value.trim();
      var errEl = ov.querySelector('#companyError');
      if(!company){ errEl.classList.add('show'); ov.querySelector('#f_company').focus(); return; }
      errEl.classList.remove('show');
      var link = ov.querySelector('#f_link').value.trim();
      if(link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
      var data = {
        company: company,
        role: ov.querySelector('#f_role').value.trim(),
        category: ov.querySelector('#f_category').value,
        startDate: ov.querySelector('#f_start').value,
        startTime: ov.querySelector('#f_start').value ? ov.querySelector('#f_startTime').value : '',

        priority: selectedPriority,
        memo: ov.querySelector('#f_memo').value.trim()
      };

          newPostings[idx] = merged;
          closeModal();
          persist({ postings: newPostings });
          showToast('공고를 수정했어요.');
        }
      } else {
        data.id = uid();
        data.status = 'applying';
        data.createdAt = new Date().toISOString();
        var np = state.postings.concat([data]);
        closeModal();
        persist({ postings: np });
        showToast('공고를 추가했어요.');
      }
    });
  }});
}

/* ============ detail modal ============ */
function openDetailModal(id){
  var p = state.postings.find(function(x){ return x.id===id; });
  if(!p) return;
  var badges = '';
  if(p.category) badges += '<span class="badge">'+esc(CATEGORY_LABELS[p.category]||p.category)+'</span>';
  if(p.priority) badges += '<span class="badge pri-'+p.priority+'">우선순위 '+PRIORITY_LABELS[p.priority]+'</span>';

  var rows = '';
  if(p.role){
    rows += '<div class="detail-row"><div class="k">직무</div><div class="v">'+esc(p.role)+'</div></div>';
  }
  if(p.startDate || p.deadlineDate){
    var periodLabel, periodVal;
    if(p.startDate && p.deadlineDate){
      periodLabel = '기간';
      periodVal = fmtDateFull(p.startDate, p.startTime) + ' ~ ' + fmtDateFull(p.deadlineDate, p.deadlineTime);
    } else if(p.deadlineDate){
      periodLabel = '마감';
      periodVal = fmtDateFull(p.deadlineDate, p.deadlineTime);
    } else {
      periodLabel = '시작일';
      periodVal = fmtDateFull(p.startDate, p.startTime);
    }
    rows += '<div class="detail-row"><div class="k">'+periodLabel+'</div><div class="v mono">'+esc(periodVal)+'</div></div>';
  }
  if(p.link){
    rows += '<div class="detail-row"><div class="k">링크</div><div class="v"><a href="'+esc(p.link)+'" target="_blank" rel="noopener noreferrer">'+esc(p.link)+'</a></div></div>';
  }
  if(p.memo){
    rows += '<div class="detail-row"><div class="k">메모</div><div class="v" style="white-space:pre-wrap;">'+esc(p.memo)+'</div></div>';
  }
  if(!p.role && !p.startDate && !p.deadlineDate && !p.link && !p.memo){
    rows += '<div class="detail-row"><div class="k">정보</div><div class="v" style="color:var(--ink-faint)">추가된 세부 정보가 없어요.</div></div>';
  }

  var isApplied = p.status === 'applied';
  var html =
  '<div class="modal" role="dialog" aria-modal="true">'+
    '<div class="modal-head"><h2>공고 상세</h2>'+
      '<button class="modal-close" data-close aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'+
    '</div>'+
    '<div class="modal-body">'+
      '<p class="detail-company">'+esc(p.company)+'</p>'+
      (badges ? '<div class="detail-badges">'+badges+'</div>' : '<div style="height:6px"></div>')+
      '<div class="detail-rows">'+rows+
        '<div class="toggle-row">'+
          '<div><div class="label">지원 완료</div><div class="sub">'+(isApplied?'지원을 완료했어요':'아직 지원중이에요')+'</div></div>'+
          '<button type="button" class="switch'+(isApplied?' on':'')+'" id="statusSwitch" role="switch" aria-checked="'+isApplied+'"><span class="knob"></span></button>'+
        '</div>'+
      '</div>'+
      '<div class="detail-actions">'+
        '<button type="button" class="btn btn-ghost" id="editBtn">수정</button>'+
        '<button type="button" class="btn btn-danger" id="deleteBtn">삭제</button>'+
      '</div>'+
    '</div>'+
  '</div>';

  openModal(html, { onMount: function(ov){
    ov.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click', closeModal); });
    ov.querySelector('#statusSwitch').addEventListener('click', function(){
      var idx = state.postings.findIndex(function(x){ return x.id===id; });
      if(idx===-1) return;
      var newPostings = state.postings.slice();
      newPostings[idx] = Object.assign({}, newPostings[idx], { status: newPostings[idx].status==='applied' ? 'applying' : 'applied' });
      closeModal();
      persist({ postings: newPostings });
    });
    ov.querySelector('#editBtn').addEventListener('click', function(){
      closeModal();
      openFormModal(p);
    });
    ov.querySelector('#deleteBtn').addEventListener('click', function(){
      closeModal();
      openConfirmDelete(id);
    });
  }});
}

/* ============ delete confirm ============ */
function openConfirmDelete(id){
  var p = state.postings.find(function(x){ return x.id===id; });
  if(!p) return;
  var html =
  '<div class="modal confirm-modal" role="dialog" aria-modal="true">'+
    '<p>"'+esc(p.company)+'" 일정을 삭제하시겠습니까?</p>'+
    '<div class="confirm-actions">'+
      '<button type="button" class="btn btn-ghost" data-no>아니오</button>'+
      '<button type="button" class="btn btn-danger" data-yes>예</button>'+
    '</div>'+
  '</div>';
  openModal(html, { onMount: function(ov){
    ov.querySelector('[data-no]').addEventListener('click', closeModal);
    ov.querySelector('[data-yes]').addEventListener('click', function(){
      var np = state.postings.filter(function(x){ return x.id!==id; });
      closeModal();
      persist({ postings: np });
      showToast('일정을 삭제했어요.');
    });
  }});
}

/* ============ day overflow list ============ */
function openDayListModal(dateStr){
  var d = parseYMD(dateStr);
  var items = state.postings.filter(isVisible).filter(function(p){
    var r = resolveRange(p);
    if(!r) return false;
    return r.start <= d && d <= r.end;
  });
  var rows = items.map(function(p){
    var cls = p.priority ? ('pri-'+p.priority) : '';
    return '<div class="daylist-item" data-id="'+esc(p.id)+'" data-open-detail="1">'+
      '<span class="swatch '+cls+'" style="background:'+ (p.priority ? 'var(--'+({high:'pri-high-bg',medium:'pri-med-bg',low:'pri-low-bg'})[p.priority]+')' : 'var(--pri-none-bg)') +'"></span>'+
      '<span class="name">'+(p.status==='applied'?'✓ ':'')+esc(p.company)+'</span>'+
      '<span class="st">'+(p.status==='applied'?'지원완료':'지원중')+'</span>'+
    '</div>';
  }).join('');
  var html =
  '<div class="modal" role="dialog" aria-modal="true">'+
    '<div class="modal-head"><h2>'+fmtDateKR(d)+'</h2>'+
      '<button class="modal-close" data-close aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'+
    '</div>'+
    '<div class="modal-body">'+rows+'</div>'+
  '</div>';
  openModal(html, { onMount: function(ov){
    ov.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click', closeModal); });
  }});
}

/* ============ event delegation ============ */
function wireGlobalEvents(){
  document.addEventListener('click', function(e){
    var detailTarget = e.target.closest('[data-open-detail]');
    if(detailTarget){
      openDetailModal(detailTarget.getAttribute('data-id'));
      return;
    }
    var moreTarget = e.target.closest('[data-more-date]');
    if(moreTarget){
      openDayListModal(moreTarget.getAttribute('data-more-date'));
      return;
    }
    var toggleTarget = e.target.closest('[data-list-toggle]');
    if(toggleTarget){
      if(!canWrite){ showToast('읽기 전용 보기예요.'); return; }
      var tid = toggleTarget.getAttribute('data-list-toggle');
      var idx = state.postings.findIndex(function(x){ return x.id===tid; });
      if(idx>-1){
        var newPostings = state.postings.slice();
        newPostings[idx] = Object.assign({}, newPostings[idx], { status: newPostings[idx].status==='applied' ? 'applying' : 'applied' });
        persist({ postings: newPostings });
      }
      return;
    }
    var viewBtn = e.target.closest('.view-btn');
    if(viewBtn){
      viewMode = viewBtn.getAttribute('data-view');
      var sp = document.getElementById('sortPanel'); if(sp) sp.hidden = true;
      savePrefs(); render();
      return;
    }
  });

  document.getElementById('prevMonth').addEventListener('click', function(){
    view.month -= 1;
    if(view.month<1){ view.month=12; view.year -=1; }
    savePrefs(); render();
  });
  document.getElementById('nextMonth').addEventListener('click', function(){
    view.month += 1;
    if(view.month>12){ view.month=1; view.year +=1; }
    savePrefs(); render();
  });
  document.getElementById('todayBtn').addEventListener('click', function(){
    var t = new Date();
    view.year = t.getFullYear(); view.month = t.getMonth()+1;
    savePrefs(); render();
  });

  document.getElementById('fabAdd').addEventListener('click', function(){
    if(!canWrite){ showToast('읽기 전용 보기예요.'); return; }
    openFormModal(null);
  });

  var sortBtn = document.getElementById('sortBtn');
  var sortPanel = document.getElementById('sortPanel');

  sortBtn.addEventListener('click', function(e){
    e.stopPropagation();
    sortPanel.hidden = !sortPanel.hidden;
  });
  sortPanel.querySelectorAll('.sort-chip').forEach(function(chip){
    chip.addEventListener('click', function(){
      var key = chip.getAttribute('data-sort-key');
      var idx = sortOrder.indexOf(key);
      if(idx>-1){ sortOrder.splice(idx,1); } else { sortOrder.push(key); }
      savePrefs();
      renderSortPanelState();
      updateViewModeUI();
      renderList();
    });
  });
  sortPanel.querySelectorAll('input[type=checkbox]').forEach(function(cb){
    cb.addEventListener('change', function(){
      filter[cb.value] = cb.checked;
      savePrefs(); render();
    });
  });

  document.addEventListener('click', function(e){
    if(!sortPanel.hidden && !sortPanel.contains(e.target) && e.target!==sortBtn && !sortBtn.contains(e.target)){
      sortPanel.hidden = true;
    }
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape'){ sortPanel.hidden = true; closeModal(); }
  });
}

/* ============ init ============ */
function injectCSS(){
  var styleEl = document.createElement('style');
  styleEl.textContent = CSS_TEXT;
  document.head.appendChild(styleEl);
}

async function initCapability(){
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      caps = await window.claude.use('artifact');
    }
  }catch(e){ caps = null; }
}

function restoreStashedView(){
  try{
    var raw = sessionStorage.getItem('jobcal_view_stash');
    if(raw){ view = JSON.parse(raw); sessionStorage.removeItem('jobcal_view_stash'); return; }
  }catch(e){}
}

function loadFallbackIfNeeded(){
  if((!state.postings || state.postings.length===0)){
    try{
      var raw = localStorage.getItem(LS_FALLBACK_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && parsed.postings && parsed.postings.length){ state = parsed; }
      }
    }catch(e){}
  }
}

function boot(){
  injectCSS();
  loadPrefs();
  restoreStashedView();
  loadFallbackIfNeeded();
  document.getElementById('app').innerHTML = buildShell();
  wireGlobalEvents();
  render();
  initCapability();
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>
